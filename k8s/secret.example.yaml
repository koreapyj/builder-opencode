# Copy to k8s/secret.yaml and fill in real values. k8s/secret.yaml is gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: opencode-secrets
  namespace: opencode
type: Opaque
stringData:
  # Basic auth for the web UI. If OPENCODE_SERVER_PASSWORD is unset the server is UNSECURED.
  OPENCODE_SERVER_USERNAME: opencode
  OPENCODE_SERVER_PASSWORD: CHANGE_ME
  # Provider API keys — set the ones you use (or log in via the web UI; credentials persist on the PVC).
  ANTHROPIC_API_KEY: ""
  # OPENAI_API_KEY: ""
  # OPENROUTER_API_KEY: ""
